# TLS terminates here and is re-encrypted to the services (they serve TLS only),
# verifying each backend certificate against the internal CA.
# Secrets (out of band): ai-services-tls (front cert, both hosts) and
# ai-services/ingress-backend-ca (key ca.crt) in the same namespace.
# proxy-ssl-secret format is <namespace>/<name>. Per the ingress-nginx docs, tls.crt and
# tls.key are the client cert/key used to authenticate TO the backend (optional for us:
# the services do not require client certs), and ca.crt verifies the backend.
# CONFIRMED: ca.crt is the verification CA. UNVERIFIED: that a ca.crt-only secret is
# accepted (docs say the secret "should also contain" ca.crt); test in the pilot.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sts
  namespace: ai-services
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-secret: ai-services/ingress-backend-ca
    nginx.ingress.kubernetes.io/proxy-ssl-name: sts.ai-services.svc
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
spec:
  ingressClassName: nginx
  tls:
    - hosts: [sts.example.internal]
      secretName: ai-services-tls
  rules:
    - host: sts.example.internal
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: sts, port: {number: 8080}}}}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: ai-services
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-secret: ai-services/ingress-backend-ca
    nginx.ingress.kubernetes.io/proxy-ssl-name: gateway.ai-services.svc
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    # Gateway limits: 10 MiB body cap, long streams, no buffering.
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Do not spool request bodies (prompts) to ingress temp files.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [gateway.example.internal]
      secretName: ai-services-tls
  rules:
    - host: gateway.example.internal
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: gateway, port: {number: 8080}}}}]}
