# TLS terminates here; services speak plain HTTP inside the cluster.
# TLS secret "ai-services-tls" is created out of band.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: ai-services, namespace: ai-services}
spec:
  ingressClassName: nginx
  tls:
    - hosts: [sts.example.internal, gateway.example.internal]
      secretName: ai-services-tls
  rules:
    - host: sts.example.internal
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: sts, port: {number: 8080}}}}]}
    - host: gateway.example.internal
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: gateway, port: {number: 8080}}}}]}
